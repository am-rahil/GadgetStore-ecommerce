<div class="container py-5">
  <h3 class="text-center mb-4">Manage Users</h3>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-warning"></div>
    <p class="text-muted mt-2">Loading users...</p>
  </div>

  <ag-grid-angular
    *ngIf="!loading"
    class="ag-theme-quartz my-grid"
    style="width: 100%; height: 500px;"
    [rowData]="users"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="true"
    [paginationPageSize]="20"
    (cellClicked)="onGridClick($event)">
  </ag-grid-angular>
  

  <div *ngIf="!loading && users.length === 0" class="text-center text-muted">
    <p>No users found.</p>
  </div>
</div>
