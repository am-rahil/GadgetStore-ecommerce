<div class="container mt-4">
  <h2>Add Product</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <div class="form-group mb-3">
      <label>Product Name</label>
      <input type="text" formControlName="productName" class="form-control" placeholder="Enter product name">
    </div>

    <div class="form-group mb-3">
      <label>Description</label>
      <textarea formControlName="description" class="form-control" placeholder="Enter description"></textarea>
    </div>

    <div class="form-group mb-3">
      <label>Price</label>
      <input type="number" formControlName="price" class="form-control" placeholder="Enter price">
    </div>

    <div class="form-group mb-3">
      <label>Stock Quantity</label>
      <input type="number" formControlName="stockQuantity" class="form-control" placeholder="Enter stock quantity">
    </div>

    <!-- Category Dropdown -->
    <div class="form-group mb-3">
      <label>Category</label>
      <select formControlName="categoryId" class="form-control">
        <option value="null">Select a Category</option>
        <option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </option>
      </select>
    </div>

    <!-- Supplier Dropdown -->
    <div class="form-group mb-3">
      <label>Supplier</label>
      <select formControlName="supplierId" class="form-control">
        <option value="null">Select a Supplier</option>
        <option *ngFor="let supplier of suppliers" [value]="supplier.id">
          {{ supplier.name }}
        </option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label>Product Image</label>
      <input type="file" (change)="onFileSelected($event)" class="form-control">
    </div>

    <div class="form-group mb-3">
      <label>Add New Additional Images</label>
      <input type="file" class="form-control" multiple (change)="onGallerySelected($event)" />
    </div>
    <div class="d-flex gap-2 mt-2">
      <img *ngFor="let img of galleryPreview" [src]="img" class="img-thumbnail" width="100">
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="productForm.invalid">Add Product</button>
  </form>
</div>
