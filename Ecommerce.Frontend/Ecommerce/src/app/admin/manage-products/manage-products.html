<div class="container mt-4">
  <h3 class="text-center mb-3 ">Manage Products</h3>

  <!-- Add Product Button -->
  <div class="text-end mb-3">
    <button class="btn btn-outline-orange" (click)="addproduct()">+ Add Product</button>
  </div>

  <!-- Products Table -->
  <ag-grid-angular 
  class="ag-theme-quartz my-grid"
  style="width: 100%; height: 500px;"
  [rowData]="products"
  [columnDefs]="columnDefs" 
  [defaultColDef]="defaultColDef" 
  [pagination]="true" 
  [paginationPageSize]="20"
  (cellClicked)="onGridClick($event)">
  </ag-grid-angular>

  <!-- No Products -->
  <div *ngIf="products.length === 0" class="text-center text-muted mt-4">
    No products found.
  </div>
</div>
