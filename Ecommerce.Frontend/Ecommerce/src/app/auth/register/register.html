<div class="auth-page-container">

  <div class="auth-card-container">
    <div class="row g-0">

      <!-- Left Image Box -->
      <div class="col-lg-5 d-none d-lg-flex left-side ">
        <div class="orange-box">

        </div>
      </div>

      <!-- Right Form Section -->
      <div class="col-lg-7 right-side">
        <div class="form-content-wrapper">

          <!-- Logo -->
          <div class="auth-logo">
            <a class="nav-logo-section" routerLink="/home">
              <img src="/assets/logo.png" class="logo-icon" />
              Gadget Store</a>
          </div>

          <h2 class="form-title">Create Account</h2>

          <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

            <!-- NAME + EMAIL (Same row) -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="text" placeholder="Full Name" formControlName="fullName" class="form-control" />
                <small class="error-message"
                  [class.visible]="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.errors">
                  Min 3 characters.
                </small>
              </div>

              <div class="col-md-6 mb-3">
                <input type="email" placeholder="Email Address" formControlName="email" class="form-control" />
                <small class="error-message"
                  [class.visible]="registerForm.get('email')?.touched && registerForm.get('email')?.errors">
                  Valid email required.
                </small>
              </div>
            </div>

            <!-- PHONE -->
            <div class="form-group mb-3">
              <input type="text" placeholder="Phone Number" formControlName="phoneNumber" class="form-control" />
              <small class="error-message"
                [class.visible]="registerForm.get('phoneNumber')?.touched && registerForm.get('phoneNumber')?.errors">
                Enter 10-digit number.
              </small>
            </div>

            <!-- PASSWORD + CONFIRM PASSWORD (Same row) -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input type="password" placeholder="Password" formControlName="password" class="form-control" />
                <small class="error-message"
                  [class.visible]="registerForm.get('password')?.touched && registerForm.get('password')?.errors">
                  Min 6 characters.
                </small>
              </div>

              <div class="col-md-6 mb-3">
                <input type="password" placeholder="Confirm Password" formControlName="confirmPassword"
                  class="form-control" />
                <small class="error-message"
                  [class.visible]="registerForm.value.password !== registerForm.value.confirmPassword">
                  Passwords do not match.
                </small>
              </div>
            </div>

            <!-- BUTTON -->
            <button class="btn btn-submit w-100 mt-2" [disabled]="registerForm.invalid || isSubmitting">
              {{ isSubmitting ? 'Registering...' : 'Register' }}
            </button>

          </form>

          <div class="footer-link mt-2">
            Already have an account? <a routerLink="/auth/login">Login</a>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
