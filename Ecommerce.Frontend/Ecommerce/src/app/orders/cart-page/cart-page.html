<app-navbar></app-navbar>
<div class="cart-page-container">
  <div class="container py-5">
    <h2 class="mb-4 text-center">🛒 Your Shopping Cart</h2>

    <!--  Loading Spinner -->
    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-warning" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!--  Empty Cart -->
    <div *ngIf="!loading && cartItems.length === 0" class="text-center">
      <img src="assets/cart.webp" alt="Empty Cart" width="180" class="mb-3">
      <p class="text-muted">Your cart is empty.</p>
      <button class="btn btn-orange" routerLink="/products">Browse Products</button>
    </div>

    <!--  Cart Items -->
    <div *ngIf="filteredCartItems.length > 0" class="cart-list">
      <div class="cart-item shadow-sm " *ngFor="let item of filteredCartItems">
        <div class="cart-img">
          <img [src]="item.imagePath || 'assets/no-image.png'" alt="{{ item.productName }}">
        </div>

        <div class="cart-details d-flex justify-content-between">

          <!--  Left Half -->
          <div class="cart-left w-50 pe-3">
            <h5>{{ item.productName }}</h5>
            <p class="text-muted mb-1">{{ item.categoryName || 'Gadget' }}</p>
            <p class="price mb-2">₹{{ item.totalPrice / item.quantity }}</p>

            <div class="quantity-control">
              <button class="btn btn-sm btn-outline-dark" (click)="updateQuantity(item, -1)">−</button>
              <span class="mx-2">{{ item.quantity }}</span>
              <button class="btn btn-sm btn-outline-dark" (click)="updateQuantity(item, 1)">+</button>
            </div>
          </div>

          <!--  Right Half -->
          <div class="cart-right w-50 ps-3 border-start">
            <p class="text-muted small mb-2">
              {{ item.description || 'No description available for this product.' }}
            </p>

            <p class="total mt-2 fw-bold">Total: ₹{{ item.totalPrice }}</p>

            <button class="btn btn-danger btn-sm mt-2" (click)="removeItem(item.cartId)">
              <i class="bi bi-trash"></i> Remove
            </button>
          </div>
        </div>

      </div>

      <!-- Cart Summary -->
      <div class="text-end mt-4">
        <h4>Total: ₹{{ total }}</h4>
        <button class="btn btn-outline-danger me-2" (click)="clearCart()">Clear Cart</button>
        <button class="btn btn-primary" (click)="checkout()">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
